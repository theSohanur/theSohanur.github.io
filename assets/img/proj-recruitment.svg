<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 54.5 736 491" width="800" height="600" role="img" aria-label="Illustration of a gamified recruitment platform: candidates scored by assessment and narrowed to a shortlist">
  <defs>
  </defs>

  <rect x="-50" y="-50" width="900" height="700" fill="#F5F2FC"/>

  <!-- ============ applicant pool ============ -->
  <g>
    <rect x="56" y="150" width="196" height="300" rx="14" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
    <rect x="78" y="176" width="70" height="8" rx="4" fill="#CFC7E8"/>

    <!-- candidate rows -->
    <g>
      <circle cx="96" cy="222" r="14" fill="#EFEBFC"/>
      <circle cx="96" cy="218" r="5" fill="#B3A7E0"/>
      <path d="M86 231a10 10 0 0 1 20 0z" fill="#B3A7E0"/>
      <rect x="120" y="212" width="78" height="8" rx="4" fill="#DCD5EE"/>
      <rect x="120" y="226" width="54" height="7" rx="3.5" fill="#EDE9F8"/>
    </g>
    <g>
      <circle cx="96" cy="278" r="14" fill="#EFEBFC"/>
      <circle cx="96" cy="274" r="5" fill="#B3A7E0"/>
      <path d="M86 287a10 10 0 0 1 20 0z" fill="#B3A7E0"/>
      <rect x="120" y="268" width="62" height="8" rx="4" fill="#DCD5EE"/>
      <rect x="120" y="282" width="70" height="7" rx="3.5" fill="#EDE9F8"/>
    </g>
    <g>
      <circle cx="96" cy="334" r="14" fill="#EFEBFC"/>
      <circle cx="96" cy="330" r="5" fill="#B3A7E0"/>
      <path d="M86 343a10 10 0 0 1 20 0z" fill="#B3A7E0"/>
      <rect x="120" y="324" width="84" height="8" rx="4" fill="#DCD5EE"/>
      <rect x="120" y="338" width="48" height="7" rx="3.5" fill="#EDE9F8"/>
    </g>
    <g opacity="0.55">
      <circle cx="96" cy="390" r="14" fill="#EFEBFC"/>
      <circle cx="96" cy="386" r="5" fill="#B3A7E0"/>
      <path d="M86 399a10 10 0 0 1 20 0z" fill="#B3A7E0"/>
      <rect x="120" y="380" width="68" height="8" rx="4" fill="#DCD5EE"/>
      <rect x="120" y="394" width="58" height="7" rx="3.5" fill="#EDE9F8"/>
    </g>
  </g>

  <!-- ============ the assessment ============ -->
  <g>
    <rect x="296" y="120" width="208" height="360" rx="16" fill="#FFFFFF" stroke="#C9BFF0" stroke-width="2"/>

    <!-- progress through the game -->
    <rect x="324" y="152" width="152" height="8" rx="4" fill="#EFEBFC"/>
    <rect x="324" y="152" width="98" height="8" rx="4" fill="#6D56C1"/>

    <!-- score ring -->
    <circle cx="400" cy="256" r="62" fill="none" stroke="#EFEBFC" stroke-width="16"/>
    <circle cx="400" cy="256" r="62" fill="none" stroke="#6D56C1" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="286 390" transform="rotate(-90 400 256)"/>
    <rect x="372" y="246" width="56" height="13" rx="6.5" fill="#3B3A4A"/>
    <rect x="382" y="268" width="36" height="7" rx="3.5" fill="#CFC7E8"/>

    <!-- per-competency bars -->
    <g>
      <rect x="324" y="356" width="46" height="7" rx="3.5" fill="#CFC7E8"/>
      <rect x="324" y="372" width="152" height="9" rx="4.5" fill="#EFEBFC"/>
      <rect x="324" y="372" width="124" height="9" rx="4.5" fill="#9A8AD6"/>

      <rect x="324" y="398" width="62" height="7" rx="3.5" fill="#CFC7E8"/>
      <rect x="324" y="414" width="152" height="9" rx="4.5" fill="#EFEBFC"/>
      <rect x="324" y="414" width="86" height="9" rx="4.5" fill="#9A8AD6"/>

      <rect x="324" y="440" width="52" height="7" rx="3.5" fill="#CFC7E8"/>
      <rect x="324" y="456" width="152" height="9" rx="4.5" fill="#EFEBFC"/>
      <rect x="324" y="456" width="140" height="9" rx="4.5" fill="#6AC3A6"/>
    </g>
  </g>

  <!-- flow -->
  <path d="M258 300h30" stroke="#C9BFF0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
  <path d="M512 300h28" stroke="#C9BFF0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- ============ shortlist ============ -->
  <g>
    <rect x="548" y="186" width="196" height="228" rx="14" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
    <rect x="570" y="212" width="62" height="8" rx="4" fill="#CFC7E8"/>

    <g>
      <rect x="566" y="244" width="160" height="48" rx="10" fill="#F6F4FD"/>
      <circle cx="592" cy="268" r="14" fill="#FFFFFF"/>
      <circle cx="592" cy="264" r="5" fill="#6D56C1"/>
      <path d="M582 277a10 10 0 0 1 20 0z" fill="#6D56C1"/>
      <rect x="616" y="258" width="62" height="8" rx="4" fill="#CFC7E8"/>
      <rect x="616" y="272" width="40" height="7" rx="3.5" fill="#E3DEF1"/>
      <circle cx="704" cy="268" r="11" fill="#6AC3A6"/>
      <path d="M699 268l4 4 7-7" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="566" y="308" width="160" height="48" rx="10" fill="#F6F4FD"/>
      <circle cx="592" cy="332" r="14" fill="#FFFFFF"/>
      <circle cx="592" cy="328" r="5" fill="#6D56C1"/>
      <path d="M582 341a10 10 0 0 1 20 0z" fill="#6D56C1"/>
      <rect x="616" y="322" width="74" height="8" rx="4" fill="#CFC7E8"/>
      <rect x="616" y="336" width="34" height="7" rx="3.5" fill="#E3DEF1"/>
      <circle cx="704" cy="332" r="11" fill="#6AC3A6"/>
      <path d="M699 332l4 4 7-7" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
