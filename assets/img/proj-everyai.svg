<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 40 780 520" width="800" height="600" role="img" aria-label="Illustration of the EveryAI app: sidebar, chat composer and an automatic model switcher">
  <defs>
  </defs>

  <rect x="-50" y="-50" width="900" height="700" fill="#F5F2FC"/>

  <!-- app window -->
  <rect x="56" y="64" width="688" height="472" rx="16" fill="#FFFFFF"/>
  <rect x="56" y="64" width="688" height="472" rx="16" fill="none" stroke="#E6E1F6" stroke-width="2"/>

  <!-- sidebar -->
  <path d="M56 80a16 16 0 0 1 16-16h178v472H72a16 16 0 0 1-16-16z" fill="#FAF9FE"/>
  <line x1="250" y1="64" x2="250" y2="536" stroke="#ECE8F8" stroke-width="2"/>

  <!-- logo -->
  <rect x="84" y="92" width="34" height="34" rx="11" fill="#6D56C1"/>
  <circle cx="101" cy="109" r="8" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  <rect x="130" y="101" width="74" height="11" rx="5.5" fill="#3B3A4A"/>

  <!-- new chat -->
  <rect x="84" y="150" width="138" height="38" rx="12" fill="#EFEBFC"/>
  <path d="M105 169h16M113 161v16" stroke="#6D56C1" stroke-width="3" stroke-linecap="round"/>
  <rect x="131" y="163" width="62" height="10" rx="5" fill="#A190DD"/>

  <!-- chat history -->
  <rect x="84" y="212" width="104" height="9" rx="4.5" fill="#D9D3EE"/>
  <rect x="84" y="244" width="138" height="9" rx="4.5" fill="#E6E2F3"/>
  <rect x="84" y="272" width="118" height="9" rx="4.5" fill="#E6E2F3"/>
  <rect x="84" y="300" width="130" height="9" rx="4.5" fill="#E6E2F3"/>
  <rect x="84" y="328" width="96" height="9" rx="4.5" fill="#E6E2F3"/>

  <!-- telco partners: where the subscribers come from -->
  <rect x="84" y="438" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
  <circle cx="108" cy="466" r="11" fill="#EFEBFC"/>
  <path d="M104 466l3 3 6-6" stroke="#6D56C1" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="455" width="74" height="8" rx="4" fill="#CFC7E8"/>
  <rect x="128" y="470" width="52" height="8" rx="4" fill="#E6E2F3"/>

  <!-- headline -->
  <rect x="296" y="128" width="330" height="18" rx="9" fill="#3B3A4A"/>
  <rect x="296" y="160" width="208" height="12" rx="6" fill="#CFC7E8"/>

  <!-- model switcher: auto-picks the best model per prompt -->
  <rect x="296" y="212" width="400" height="54" rx="27" fill="#FFFFFF" stroke="#CDEDE2" stroke-width="2"/>
  <rect x="314" y="228" width="8" height="22" rx="4" fill="#6AC3A6"/>
  <rect x="330" y="234" width="46" height="10" rx="5" fill="#9A8AD6"/>
  <line x1="398" y1="224" x2="398" y2="254" stroke="#E6E1F6" stroke-width="2"/>
  <circle cx="422" cy="239" r="6" fill="#6AC3A6"/>
  <rect x="440" y="234" width="112" height="10" rx="5" fill="#CFC7E8"/>
  <rect x="616" y="224" width="58" height="30" rx="15" fill="#EDEAF9"/>
  <circle cx="659" cy="239" r="11" fill="#FFFFFF" stroke="#D6CFEE" stroke-width="2"/>

  <!-- the models it routes between -->
  <g>
    <rect x="296" y="296" width="92" height="34" rx="10" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
    <circle cx="316" cy="313" r="7" fill="#6D56C1"/>
    <rect x="331" y="309" width="42" height="8" rx="4" fill="#DAD4EE"/>

    <rect x="400" y="296" width="92" height="34" rx="10" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
    <circle cx="420" cy="313" r="7" fill="#9A8AD6"/>
    <rect x="435" y="309" width="42" height="8" rx="4" fill="#DAD4EE"/>

    <rect x="504" y="296" width="92" height="34" rx="10" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
    <circle cx="524" cy="313" r="7" fill="#6AC3A6"/>
    <rect x="539" y="309" width="42" height="8" rx="4" fill="#DAD4EE"/>

    <rect x="608" y="296" width="88" height="34" rx="10" fill="#F6F4FD" stroke="#E6E1F6" stroke-width="2"/>
    <path d="M636 313h32M652 303v20" stroke="#B3A7E0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- composer -->
  <rect x="296" y="372" width="400" height="122" rx="16" fill="#FAF9FE" stroke="#E6E1F6" stroke-width="2"/>
  <rect x="320" y="398" width="214" height="11" rx="5.5" fill="#D9D3EE"/>
  <rect x="320" y="422" width="150" height="11" rx="5.5" fill="#E8E4F5"/>
  <rect x="320" y="452" width="76" height="28" rx="9" fill="#EFEBFC"/>
  <path d="M338 466h14M345 459v14" stroke="#6D56C1" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="654" cy="464" r="20" fill="#6D56C1"/>
  <path d="M646 464h17M656 457l7 7-7 7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
