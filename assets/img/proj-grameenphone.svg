<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 55 744 496" width="800" height="600" role="img" aria-label="Illustration of field market visits on a map, with anomaly detection flagging suspicious visits into an audit table">
  <defs>
    <marker id="gp-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#6D56C1"/>
    </marker>
  </defs>

  <rect x="-50" y="-50" width="900" height="700" fill="#F5F2FC"/>

  <!-- ============ territory map ============ -->
  <rect x="54" y="92" width="392" height="416" rx="16" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>

  <!-- route grid -->
  <g stroke="#F0EDF9" stroke-width="2">
    <path d="M54 186h392M54 280h392M54 374h392"/>
    <path d="M152 92v416M250 92v416M348 92v416"/>
  </g>

  <!-- territory outlines -->
  <path d="M96 140h118v96H96z" fill="#F7F5FD" stroke="#E4DFF4" stroke-width="2"/>
  <path d="M258 206h130v120H258z" fill="#F7F5FD" stroke="#E4DFF4" stroke-width="2"/>
  <path d="M110 320h120v118H110z" fill="#F7F5FD" stroke="#E4DFF4" stroke-width="2"/>

  <!-- the rep's route for the day -->
  <path d="M142 180 L210 236 L300 262 L268 352 L176 392"
        stroke="#C9BFF0" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 11"/>

  <!-- ordinary visits -->
  <g fill="#6D56C1">
    <path d="M142 166a13 13 0 0 1 13 13c0 9-13 23-13 23s-13-14-13-23a13 13 0 0 1 13-13z"/>
    <path d="M210 222a13 13 0 0 1 13 13c0 9-13 23-13 23s-13-14-13-23a13 13 0 0 1 13-13z"/>
    <path d="M176 378a13 13 0 0 1 13 13c0 9-13 23-13 23s-13-14-13-23a13 13 0 0 1 13-13z"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="142" cy="179" r="4.5"/>
    <circle cx="210" cy="235" r="4.5"/>
    <circle cx="176" cy="391" r="4.5"/>
  </g>

  <!-- flagged visits -->
  <g>
    <circle cx="300" cy="262" r="26" fill="#E8705A" opacity="0.12"/>
    <path d="M300 249a13 13 0 0 1 13 13c0 9-13 23-13 23s-13-14-13-23a13 13 0 0 1 13-13z" fill="#E8705A"/>
    <path d="M300 256v9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="271" r="1.9" fill="#FFFFFF"/>
  </g>
  <g>
    <circle cx="268" cy="352" r="26" fill="#E8705A" opacity="0.12"/>
    <path d="M268 339a13 13 0 0 1 13 13c0 9-13 23-13 23s-13-14-13-23a13 13 0 0 1 13-13z" fill="#E8705A"/>
    <path d="M268 346v9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="268" cy="361" r="1.9" fill="#FFFFFF"/>
  </g>

  <!-- POSM inventory counter -->
  <rect x="312" y="414" width="112" height="72" rx="12" fill="#FAF9FE" stroke="#E6E1F6" stroke-width="2"/>
  <rect x="328" y="434" width="30" height="34" rx="4" fill="#DCD5EE"/>
  <rect x="364" y="444" width="30" height="24" rx="4" fill="#EFEBFC" stroke="#DCD5EE" stroke-width="2"/>
  <rect x="400" y="428" width="10" height="40" rx="4" fill="#C9BFF0"/>

  <!-- ============ detection ============ -->
  <line x1="470" y1="300" x2="536" y2="300" stroke="#6D56C1" stroke-width="3" marker-end="url(#gp-arrow)" stroke-linecap="round"/>

  <!-- ============ audit table ============ -->
  <rect x="556" y="150" width="194" height="300" rx="14" fill="#FFFFFF" stroke="#E6E1F6" stroke-width="2"/>
  <rect x="556" y="150" width="194" height="42" rx="14" fill="#6D56C1"/>
  <rect x="556" y="178" width="194" height="14" fill="#6D56C1"/>
  <rect x="576" y="166" width="84" height="9" rx="4.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- column heads -->
  <rect x="576" y="208" width="52" height="7" rx="3.5" fill="#CFC7E8"/>
  <rect x="640" y="208" width="42" height="7" rx="3.5" fill="#CFC7E8"/>
  <rect x="694" y="208" width="34" height="7" rx="3.5" fill="#CFC7E8"/>
  <line x1="576" y1="228" x2="730" y2="228" stroke="#EDE9F8" stroke-width="2"/>

  <!-- flagged rows -->
  <g>
    <rect x="566" y="238" width="174" height="40" rx="7" fill="#FDF2F0"/>
    <circle cx="586" cy="258" r="5" fill="#E8705A"/>
    <rect x="600" y="248" width="62" height="7" rx="3.5" fill="#D8BEB8"/>
    <rect x="600" y="262" width="40" height="6" rx="3" fill="#E9D4D0"/>
    <rect x="690" y="253" width="38" height="12" rx="6" fill="#E8705A" opacity="0.18"/>
  </g>
  <g>
    <rect x="566" y="288" width="174" height="40" rx="7" fill="#FDF2F0"/>
    <circle cx="586" cy="308" r="5" fill="#E8705A"/>
    <rect x="600" y="298" width="74" height="7" rx="3.5" fill="#D8BEB8"/>
    <rect x="600" y="312" width="34" height="6" rx="3" fill="#E9D4D0"/>
    <rect x="690" y="303" width="38" height="12" rx="6" fill="#E8705A" opacity="0.18"/>
  </g>

  <!-- clean rows -->
  <g opacity="0.75">
    <circle cx="586" cy="356" r="5" fill="#C9BFF0"/>
    <rect x="600" y="346" width="58" height="7" rx="3.5" fill="#E3DEF1"/>
    <rect x="600" y="360" width="44" height="6" rx="3" fill="#EDE9F8"/>
    <circle cx="586" cy="400" r="5" fill="#C9BFF0"/>
    <rect x="600" y="390" width="70" height="7" rx="3.5" fill="#E3DEF1"/>
    <rect x="600" y="404" width="38" height="6" rx="3" fill="#EDE9F8"/>
  </g>

  <!-- month-to-date export -->
  <rect x="596" y="470" width="114" height="44" rx="10" fill="#FFFFFF" stroke="#C9BFF0" stroke-width="2"/>
  <rect x="614" y="484" width="22" height="16" rx="3" fill="#6AC3A6"/>
  <rect x="646" y="486" width="46" height="7" rx="3.5" fill="#DCD5EE"/>
</svg>
